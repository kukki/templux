name: ${TEMPLUX_PROJECT_NAME:-templux}

x-start-environment: &start-environment
  TEMPLUX_EFFECTIVE_PROJECT: ${COMPOSE_PROJECT_NAME}
  TEMPLUX_PROJECT_NAME: ${TEMPLUX_PROJECT_NAME-}
  DEPLOYMENT_ENV: ${DEPLOYMENT_ENV-}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL-}
  TEMPLUX_ACCESS_MODE: ${TEMPLUX_ACCESS_MODE-local}
  APP_HOST: ${APP_HOST-}
  DOMAIN_NAME: ${DOMAIN_NAME-}
  NETWORK_NAME: ${NETWORK_NAME-}
  ENTRY_TRUSTED_PROXY_CIDRS: ${ENTRY_TRUSTED_PROXY_CIDRS-}

x-auth-environment: &auth-environment
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS-90}
  AUDIT_CLEANUP_BATCH_SIZE: ${AUDIT_CLEANUP_BATCH_SIZE-1000}
  AUDIT_CLEANUP_MAX_BATCHES: ${AUDIT_CLEANUP_MAX_BATCHES-10}
  AUDIT_CLEANUP_INTERVAL_SECONDS: ${AUDIT_CLEANUP_INTERVAL_SECONDS-3600}
  RUNTIME_LOG_MAX_BYTES: ${RUNTIME_LOG_MAX_BYTES-10485760}
  RUNTIME_LOG_MAX_FILES: ${RUNTIME_LOG_MAX_FILES-10}
  PASSWORD_PROXY_HOSTS: ${PASSWORD_PROXY_HOSTS-web}
  FEISHU_APP_ID: ${FEISHU_APP_ID:-}
  FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
  FEISHU_ALLOWED_TENANT_KEY: ${FEISHU_ALLOWED_TENANT_KEY:-}
  FEISHU_TENANT_KEY: ${FEISHU_TENANT_KEY:-}
  FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL-}
  DEPLOYMENT_ENV: ${DEPLOYMENT_ENV-}
  AGENT_LOGIN_ENABLED: ${AGENT_LOGIN_ENABLED:-}
  AGENT_IDLE_TIMEOUT_SECONDS: ${AGENT_IDLE_TIMEOUT_SECONDS:-600}
  AGENT_SESSION_MAX_SECONDS: ${AGENT_SESSION_MAX_SECONDS:-43200}
  HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-30}
  PERSON_IDLE_TIMEOUT_SECONDS: ${PERSON_IDLE_TIMEOUT_SECONDS:-600}
  PERSON_SESSION_MAX_SECONDS: ${PERSON_SESSION_MAX_SECONDS:-43200}

x-database-environment: &database-environment
  DATABASE_URL: ${DATABASE_URL-}

x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: "${RUNTIME_LOG_MAX_BYTES-10485760}"
    max-file: "${RUNTIME_LOG_MAX_FILES-10}"
    compress: "false"

services:
  environment:
    build:
      context: .
      target: api
    entrypoint: ["node", "shared/environment-cli.mjs"]
    command: ["check", "--json"]
    environment:
      NODE_OPTIONS: ""
      TEMPLUX_ENV_DIR: /run/templux-env
      TEMPLUX_EFFECTIVE_PROJECT: ${COMPOSE_PROJECT_NAME}
      TEMPLUX_PROJECT_NAME: ${TEMPLUX_PROJECT_NAME-}
      TEMPLUX_HTTP_PORT: ${TEMPLUX_HTTP_PORT-}
      TEMPLUX_API_PORT: ${TEMPLUX_API_PORT-}
      TEMPLUX_DB_PASSWORD: ${TEMPLUX_DB_PASSWORD-}
      DATABASE_URL: ${DATABASE_URL-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL-}
      FEISHU_APP_ID: ${FEISHU_APP_ID-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET-}
      FEISHU_TENANT_KEY: ${FEISHU_TENANT_KEY-}
      FEISHU_ALLOWED_TENANT_KEY: ${FEISHU_ALLOWED_TENANT_KEY-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI-}
      PERSON_IDLE_TIMEOUT_SECONDS: ${PERSON_IDLE_TIMEOUT_SECONDS-}
      PERSON_SESSION_MAX_SECONDS: ${PERSON_SESSION_MAX_SECONDS-}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV-}
      AGENT_LOGIN_ENABLED: ${AGENT_LOGIN_ENABLED-}
      AGENT_IDLE_TIMEOUT_SECONDS: ${AGENT_IDLE_TIMEOUT_SECONDS-}
      AGENT_SESSION_MAX_SECONDS: ${AGENT_SESSION_MAX_SECONDS-}
      TEMPLUX_CREDENTIAL_DIR: ${TEMPLUX_CREDENTIAL_DIR-}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS-}
      PASSWORD_PROXY_HOSTS: ${PASSWORD_PROXY_HOSTS-}
      ENTRY_TRUSTED_PROXY_CIDRS: ${ENTRY_TRUSTED_PROXY_CIDRS-}
      WEB_TRUSTED_PROXY_CIDRS: ${WEB_TRUSTED_PROXY_CIDRS-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS-90}
      AUDIT_CLEANUP_BATCH_SIZE: ${AUDIT_CLEANUP_BATCH_SIZE-1000}
      AUDIT_CLEANUP_MAX_BATCHES: ${AUDIT_CLEANUP_MAX_BATCHES-10}
      AUDIT_CLEANUP_INTERVAL_SECONDS: ${AUDIT_CLEANUP_INTERVAL_SECONDS-3600}
      RUNTIME_LOG_MAX_BYTES: ${RUNTIME_LOG_MAX_BYTES-10485760}
      RUNTIME_LOG_MAX_FILES: ${RUNTIME_LOG_MAX_FILES-10}
      COMPONENT_EXAMPLES_ENABLED: ${COMPONENT_EXAMPLES_ENABLED-auto}
      TEMPLUX_BACKUP_DIR: ${TEMPLUX_BACKUP_DIR-}
      TEMPLUX_BACKUP_RETAIN: ${TEMPLUX_BACKUP_RETAIN-}
      TEMPLUX_ACCESS_MODE: ${TEMPLUX_ACCESS_MODE-local}
      APP_HOST: ${APP_HOST-}
      DOMAIN_NAME: ${DOMAIN_NAME-}
      NETWORK_NAME: ${NETWORK_NAME-}
    volumes:
      - .:/run/templux-env:ro
    restart: "no"

  database:
    logging: *runtime-logging
    depends_on:
      environment:
        condition: service_completed_successfully
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: templux
      POSTGRES_USER: templux
      POSTGRES_PASSWORD: ${TEMPLUX_DB_PASSWORD-}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U templux -d templux"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    logging: *runtime-logging
    depends_on:
      environment:
        condition: service_completed_successfully
    build:
      context: .
      target: api
    environment:
      TEMPLUX_ENV_SCOPE: api
      NODE_OPTIONS: "--no-warnings --import=./shared/environment-startup.mjs"
      <<: [*start-environment, *database-environment, *auth-environment]
      TEMPLUX_MAINTENANCE_RELEASE_FILE: /opt/templux/maintenance/release.json
      TEMPLUX_CONFIG_PATH: /opt/templux/config/presentation.json
    volumes:
      - maintenance:/opt/templux/maintenance:ro
      - ./config:/opt/templux/config:ro
    ports:
      - "127.0.0.1:${TEMPLUX_API_PORT:-31800}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 8s
      retries: 10
    restart: unless-stopped

  entry:
    logging: *runtime-logging
    depends_on:
      environment:
        condition: service_completed_successfully
    build:
      context: .
      target: api
    command: ["node", "apps/api/dist/entry-server.js"]
    environment:
      TEMPLUX_ENV_SCOPE: entry
      NODE_OPTIONS: "--no-warnings --import=./shared/environment-startup.mjs"
      <<: [*start-environment, *database-environment]
      ENTRY_TRUSTED_PROXY_CIDRS: ${ENTRY_TRUSTED_PROXY_CIDRS-}
      RUNTIME_LOG_MAX_BYTES: ${RUNTIME_LOG_MAX_BYTES-10485760}
      RUNTIME_LOG_MAX_FILES: ${RUNTIME_LOG_MAX_FILES-10}
      TEMPLUX_MAINTENANCE_RELEASE_FILE: /opt/templux/maintenance/release.json
      TEMPLUX_CONFIG_PATH: /opt/templux/config/presentation.json
    volumes:
      - maintenance:/opt/templux/maintenance:ro
      - ./config:/opt/templux/config:ro
    ports:
      - "127.0.0.1:${TEMPLUX_HTTP_PORT:-31000}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 8s
      retries: 10
    restart: unless-stopped

  web:
    logging: *runtime-logging
    depends_on:
      environment:
        condition: service_completed_successfully
    build:
      context: .
      target: web
    environment:
      <<: *start-environment
      TEMPLUX_ENV_SCOPE: web
      NODE_OPTIONS: "--no-warnings --import=./shared/environment-startup.mjs"
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV-}
      COMPONENT_EXAMPLES_ENABLED: ${COMPONENT_EXAMPLES_ENABLED-auto}
      API_INTERNAL_URL: http://api:8080
      RUNTIME_LOG_MAX_BYTES: ${RUNTIME_LOG_MAX_BYTES-10485760}
      RUNTIME_LOG_MAX_FILES: ${RUNTIME_LOG_MAX_FILES-10}
      WEB_ENTRY_PROXY_HOSTS: entry
      WEB_TRUSTED_PROXY_CIDRS: ${WEB_TRUSTED_PROXY_CIDRS:-}
      TEMPLUX_CONFIG_PATH: /opt/templux/config/presentation.json
    volumes:
      - ./config:/opt/templux/config:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 8s
      retries: 10
    restart: unless-stopped

  migrate:
    logging: *runtime-logging
    build:
      context: .
      target: migration
    environment:
      TEMPLUX_ENV_SCOPE: migration
      NODE_OPTIONS: "--no-warnings --import=./shared/environment-startup.mjs"
      <<: [*start-environment, *database-environment]
      TEMPLUX_PROJECT_NAME: ${TEMPLUX_PROJECT_NAME-}
      TEMPLUX_BACKUP_DIR: /opt/templux/backups
      TEMPLUX_BACKUP_RETAIN: ${TEMPLUX_BACKUP_RETAIN-5}
      TEMPLUX_HOST_UID: ${TEMPLUX_HOST_UID-0}
      TEMPLUX_HOST_GID: ${TEMPLUX_HOST_GID-0}
    volumes:
      - ${TEMPLUX_BACKUP_DIR-./backups}:/opt/templux/backups
    profiles: ["tools"]
    entrypoint: ["node", "apps/api/dist/migrate.js"]

  auth-config-probe:
    logging: *runtime-logging
    build:
      context: .
      target: api
    environment:
      <<: [*start-environment, *auth-environment]
      TEMPLUX_ENV_SCOPE: probe
      NODE_OPTIONS: "--no-warnings --import=./shared/environment-startup.mjs"
    profiles: ["tools"]
    entrypoint: ["node", "apps/api/dist/auth-config-probe.js"]

  management:
    logging: *runtime-logging
    build:
      context: .
      target: management
    environment:
      TEMPLUX_ENV_SCOPE: management
      NODE_OPTIONS: "--no-warnings --import=./shared/environment-startup.mjs"
      <<: [*start-environment, *database-environment]
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV-}
      AGENT_LOGIN_ENABLED: ${AGENT_LOGIN_ENABLED:-}
      RUNTIME_LOG_MAX_BYTES: ${RUNTIME_LOG_MAX_BYTES-10485760}
      RUNTIME_LOG_MAX_FILES: ${RUNTIME_LOG_MAX_FILES-10}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS-90}
      AUDIT_CLEANUP_BATCH_SIZE: ${AUDIT_CLEANUP_BATCH_SIZE-1000}
      AUDIT_CLEANUP_MAX_BATCHES: ${AUDIT_CLEANUP_MAX_BATCHES-10}
      AUDIT_CLEANUP_INTERVAL_SECONDS: ${AUDIT_CLEANUP_INTERVAL_SECONDS-3600}
      COMPONENT_EXAMPLES_ENABLED: ${COMPONENT_EXAMPLES_ENABLED-auto}
      TEMPLUX_BACKUP_DIR: /opt/templux/backups
      TEMPLUX_BACKUP_RETAIN: ${TEMPLUX_BACKUP_RETAIN-5}
      TEMPLUX_CREDENTIAL_DIR: /opt/templux/credentials
      TEMPLUX_BACKUP_BIND_DIR: ${TEMPLUX_BACKUP_DIR-./backups}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_TENANT_KEY: ${FEISHU_TENANT_KEY:-}
      FEISHU_ALLOWED_TENANT_KEY: ${FEISHU_ALLOWED_TENANT_KEY:-}
      TEMPLUX_MAINTENANCE_RELEASE_FILE: /opt/templux/maintenance/release.json
      TEMPLUX_CONFIG_PATH: /opt/templux/config/presentation.json
      TEMPLUX_PROJECT_NAME: ${TEMPLUX_PROJECT_NAME-}
      TEMPLUX_HTTP_PORT: ${TEMPLUX_HTTP_PORT:-31000}
      TEMPLUX_API_PORT: ${TEMPLUX_API_PORT:-31800}
      TEMPLUX_DB_PASSWORD: ${TEMPLUX_DB_PASSWORD-}
    volumes:
      - ${TEMPLUX_BACKUP_DIR-./backups}:/opt/templux/backups
      - maintenance:/opt/templux/maintenance
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/opt/templux/config
      - ${TEMPLUX_CREDENTIAL_DIR:-./credentials}:/opt/templux/credentials
    profiles: ["tools"]

  checks:
    logging: *runtime-logging
    build:
      context: .
      target: checks
    environment:
      TEMPLUX_CONFIG_PATH: /opt/templux/config/presentation.json
      TEST_AUTH_DATABASE_URL: postgresql://templux_test:isolated-test-only@auth-database:5432/templux_auth_test
      TEST_API_URL: http://api:8080
      TEST_WEB_URL: http://web:3000
      TEST_SSR_WEB_URL: http://ssr-body-web:3000
    volumes:
      - ./config:/opt/templux/config:ro
    profiles: ["tools"]

  auth-database:
    logging: *runtime-logging
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: templux_auth_test
      POSTGRES_USER: templux_test
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U templux_test -d templux_auth_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    profiles: ["tools"]

  auth-browser:
    logging: *runtime-logging
    image: ${TEMPLUX_PROJECT_NAME:-templux}-checks
    environment:
      PASSWORD_PROXY_HOSTS: auth-web
      DATABASE_URL: postgresql://templux_test:isolated-test-only@auth-database:5432/templux_auth_test
      TEMPLUX_CONFIG_PATH: /opt/templux/config/presentation.json
    entrypoint: ["node", "tests/fixtures/auth-browser-server.mjs"]
    volumes:
      - ./config:/opt/templux/config:ro
    profiles: ["tools"]

  auth-web:
    logging: *runtime-logging
    image: ${TEMPLUX_PROJECT_NAME:-templux}-web
    environment:
      API_INTERNAL_URL: http://auth-browser:8080
      TEMPLUX_CONFIG_PATH: /opt/templux/config/presentation.json
    volumes:
      - ./config:/opt/templux/config:ro
    ports:
      - "127.0.0.1:31030:3000"
    profiles: ["tools"]

  password-api:
    logging: *runtime-logging
    image: ${TEMPLUX_PROJECT_NAME:-templux}-api
    environment:
      DATABASE_URL: postgresql://templux_test:isolated-test-only@auth-database:5432/templux_auth_test
      APP_PUBLIC_URL: ${TEST_AUTH_PUBLIC_URL:-http://localhost:31040}
      PASSWORD_PROXY_HOSTS: password-web
      DEPLOYMENT_ENV: ${TEST_DEPLOYMENT_ENV-DEV}
      AGENT_LOGIN_ENABLED: ${TEST_AGENT_LOGIN_ENABLED:-}
      HEARTBEAT_INTERVAL_SECONDS: ${TEST_HEARTBEAT_INTERVAL_SECONDS:-30}
      TEMPLUX_CONFIG_PATH: /opt/templux/config/presentation.json
    volumes:
      - ./config:/opt/templux/config:ro
    profiles: ["tools"]

  password-web:
    logging: *runtime-logging
    image: ${TEMPLUX_PROJECT_NAME:-templux}-web
    environment:
      DEPLOYMENT_ENV: ${TEST_DEPLOYMENT_ENV-DEV}
      COMPONENT_EXAMPLES_ENABLED: ${TEST_COMPONENT_EXAMPLES_ENABLED-auto}
      API_INTERNAL_URL: http://password-api:8080
      WEB_TRUSTED_PROXY_CIDRS: ${TEST_WEB_TRUSTED_PROXY_CIDRS:-}
      TEMPLUX_CONFIG_PATH: /opt/templux/config/presentation.json
    volumes:
      - ./config:/opt/templux/config:ro
    ports:
      - "127.0.0.1:31040:3000"
    profiles: ["tools"]

  ssr-body-api:
    logging: *runtime-logging
    image: ${TEMPLUX_PROJECT_NAME:-templux}-checks
    entrypoint: ["node", "tests/fixtures/ssr-body-server.mjs"]
    profiles: ["tools"]

  ssr-body-web:
    logging: *runtime-logging
    image: ${TEMPLUX_PROJECT_NAME:-templux}-web
    environment:
      API_INTERNAL_URL: http://ssr-body-api:8080
      TEMPLUX_CONFIG_PATH: /opt/templux/config/presentation.json
    volumes:
      - ./config:/opt/templux/config:ro
    profiles: ["tools"]

volumes:
  maintenance:
  database:
